name: request-budget-runtime

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-budget:
    name: Provider request budget runtime acceptance
    runs-on: windows-2022
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Report tested source commit
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($source -notmatch '^[0-9a-fA-F]{40}$') { throw "Could not resolve exact tested source commit." }
          Write-Host "OMNIX request-budget source commit: $source"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure VSTO/Office PIA SDK is present
        shell: pwsh
        run: ./build/ensure-vsto-sdk.ps1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        shell: pwsh
        run: nuget restore OMNIX.sln

      - name: Build OMNIX.Core
        shell: pwsh
        run: |
          msbuild .\src\OMNIX.Core\OMNIX.Core.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll)) {
            throw "Compiled OMNIX.Core.dll is missing."
          }

      - name: Execute provider request budget acceptance
        shell: powershell
        run: |
          .\tools\request-budget-acceptance.ps1 `
            -CorePath .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll `
            -OutputPath .\build\artifact\request-budget-acceptance.json

      - name: Validate sanitized acceptance report
        shell: pwsh
        run: |
          $path = '.\build\artifact\request-budget-acceptance.json'
          if (-not (Test-Path $path)) { throw "Request-budget report is missing." }
          $report = Get-Content $path -Raw | ConvertFrom-Json
          if ($report.TestId -ne 'REQUEST-BUDGET-RUNTIME-001') { throw "Unexpected request-budget TestId." }
          if (-not [bool]$report.OverallPass) { throw "Request-budget runtime acceptance failed." }
          if ([int]$report.FailureCount -ne 0) { throw "Request-budget report contains failures." }
          Write-Host "OMNIX request-budget runtime acceptance: PASS"

      - name: Upload request budget evidence
        uses: actions/upload-artifact@v4
        with:
          name: omnix-request-budget-evidence
          path: build/artifact/request-budget-acceptance.json
          if-no-files-found: error
