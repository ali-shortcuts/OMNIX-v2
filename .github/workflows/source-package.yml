name: source-package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source:
    name: Package exact source ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Create source provenance
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "$sha" = "${GITHUB_SHA}"
          printf '%s\n' "$sha" > SOURCE-COMMIT.txt
          printf 'Repository: %s\nCommit: %s\nGenerated by GitHub Actions source-package workflow.\n' "$GITHUB_REPOSITORY" "$sha" > SOURCE-PROVENANCE.txt

      - name: Build deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=OMNIX/ -o dist/OMNIX-complete-source.zip HEAD
          # Add provenance files generated for this exact run without modifying source history.
          mkdir -p provenance/OMNIX
          cp SOURCE-COMMIT.txt SOURCE-PROVENANCE.txt provenance/OMNIX/
          (cd provenance && zip -q -u ../dist/OMNIX-complete-source.zip OMNIX/SOURCE-COMMIT.txt OMNIX/SOURCE-PROVENANCE.txt)
          sha256sum dist/OMNIX-complete-source.zip > dist/OMNIX-complete-source.zip.sha256

      - name: Upload exact source package
        uses: actions/upload-artifact@v4
        with:
          name: omnix-source-zip
          path: |
            dist/OMNIX-complete-source.zip
            dist/OMNIX-complete-source.zip.sha256
          if-no-files-found: error
          retention-days: 30
