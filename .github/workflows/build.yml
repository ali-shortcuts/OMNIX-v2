# ============================================================================
# OMNIX CI — build the full solution on Windows, package the single-exe
# installer, run the honest Defender check, and (on version tags) publish a
# GitHub Release with the ONE .exe file (spec Phase 2.7, 2.8, Section 12).
# ============================================================================
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  SOLUTION: OMNIX.sln
  CONFIGURATION: Release

jobs:
  build:
    name: Build + package (windows-latest)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exclude workspace from Windows Defender real-time scanning during build (mitigates a transient file-lock race where the FindRibbons VSTO task reflects-loads a just-written host DLL a fraction of a second after CoreCompile writes it — the 2nd/3rd project in a multi-project VSTO solution build is the one usually hit, matching the observed OMNIX.Word/OMNIX.PowerPoint failures while OMNIX.Excel, built first, succeeded)
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Write-Host "Defender exclusion added for $env:GITHUB_WORKSPACE"
          } catch {
            Write-Host "Could not add Defender exclusion (non-fatal): $_"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-prerelease: false

      - name: Ensure VSTO SDK is present (installs Office dev tools if missing)
        shell: pwsh
        run: ./build/ensure-vsto-sdk.ps1

      - name: Create temporary self-signed code-signing certificate
        id: cert
        shell: pwsh
        run: |
          ./build/create-signing-cert.ps1
          Write-Host "--- Diagnostic: cert files present? ---"
          Write-Host "OMNIX.cer  : $(Test-Path build/cert/OMNIX.cer)"
          Write-Host "OMNIX.pfx  : $(Test-Path build/cert/OMNIX.pfx)"
          Write-Host "thumbprint : $(Test-Path build/cert/thumbprint.txt)"
          $thumb = ""
          if (Test-Path build/cert/thumbprint.txt) { $thumb = (Get-Content build/cert/thumbprint.txt).Trim() }
          "thumbprint=$thumb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Thumbprint: $thumb"
          if (-not $thumb) { Write-Host "WARNING: thumbprint is EMPTY — cert creation likely failed silently upstream." }

      - name: NuGet restore
        shell: pwsh
        run: |
          if (-not (Test-Path build/nuget.exe)) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile build/nuget.exe
          }
          ./build/nuget.exe restore $env:SOLUTION

      - name: Build solution (3 independent fallback strategies — see build/build-with-fallbacks.ps1)
        shell: pwsh
        run: ./build/build-with-fallbacks.ps1 ${{ steps.cert.outputs.thumbprint }}

      - name: Stage installer payload
        shell: pwsh
        run: |
          ./build/package.ps1
          Write-Host "--- Diagnostic: payload contents after package.ps1 ---"
          Get-ChildItem installer\payload -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  " + $_.Name + "  " + $_.Length + " bytes") }
          Write-Host "OMNIX.cer in payload? $(Test-Path installer\payload\OMNIX.cer)"

      - name: Download the official Microsoft VSTO Runtime redistributable and bundle it into the payload (offline-install friendly, and avoids the fragile in-installer download-page code path)
        shell: pwsh
        run: |
          try {
            $dest = "installer\payload\vstor_redist.exe"
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -Uri "https://download.microsoft.com/download/C/0/0/C001737F-822B-48C2-8F6A-CDE13B4B9E9C/vstor_redist.exe" -OutFile $dest -UseBasicParsing -TimeoutSec 180
            $size = (Get-Item $dest).Length
            Write-Host "Downloaded vstor_redist.exe: $size bytes"
            if ($size -lt 10000000) { throw "vstor_redist.exe looks too small ($size bytes, expected ~40MB) — download likely failed" }
            exit 0
          } catch {
            "EXCEPTION downloading vstor_redist.exe: $($_.Exception.GetType().FullName): $($_.Exception.Message)" | Tee-Object -FilePath build_output_vstodownload.txt
            exit 1
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile single-exe installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # Derive the real version from the git tag that triggered this run
          # (e.g. refs/tags/v1.0.1 -> "1.0.1"); fall back to a dev-marker for
          # ordinary branch pushes so the output filename never lies about
          # which version it actually is (this is exactly what caused the
          # v1.0.1 GitHub Release to contain a file still named ...-1.0.0.exe).
          $ver = "0.0.0-dev"
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $ver = $Matches[1] }
          Write-Host "Building installer version: $ver"
          & $iscc "/DMyAppVersion=$ver" "installer/installer.iss" 2>&1 | Tee-Object -FilePath build_output_innosetup.txt
          $code = $LASTEXITCODE
          Get-ChildItem installer/Output -ErrorAction SilentlyContinue
          if ($code -eq 0) {
            # Success — remove this step's own log so it never pollutes a LATER
            # step's diagnostic capture (this exact bug hid a real Defender-step
            # failure behind a wall of stale, successful Inno Setup output once already).
            Remove-Item build_output_innosetup.txt -ErrorAction SilentlyContinue
          }
          exit $code

      - name: Post build output to a GitHub Issue if ANY step so far failed (diagnostic — network to blob storage is restricted for the human/AI reviewing this)
        if: failure()
        shell: pwsh
        run: |
          $full = (Get-ChildItem build_output_*.txt -ErrorAction SilentlyContinue | Sort-Object Name | Get-Content -Raw) -join "`n--- next file ---`n"
          if (-not $full) { $full = "(no build_output_*.txt files were produced by any strategy)" }
          if ($full.Length -gt 55000) { $full = $full.Substring($full.Length - 55000) }
          $body = @{
            title = "CI build failure — run $env:GITHUB_RUN_ID"
            body  = "``````text`n$full`n``````"
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues" -Method Post -Headers $headers -Body $body -ContentType "application/json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Actually RUN the installer silently and verify it completes (this is the gap that let 'Runtime error at 7.72 - Could not call proc' slip through undetected - CI only compiled it before, never executed it)"
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\Output\OMNIX-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "No installer exe found to test!"; exit 1 }
          Write-Host "Running: $($exe.FullName) /VERYSILENT /SUPPRESSMSGBOXES /LOG=install_test.log /NORESTART"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/LOG=$PWD\install_test.log","/NORESTART" -Wait -PassThru
          Write-Host "Installer process exit code: $($p.ExitCode)"
          if (Test-Path install_test.log) {
            Write-Host "--- Inno Setup /LOG output ---"
            Get-Content install_test.log | Write-Host
          } else {
            Write-Host "No install_test.log was produced."
          }
          if ($p.ExitCode -ne 0) {
            $logContent = ""
            if (Test-Path install_test.log) { $logContent = Get-Content install_test.log -Raw }
            if ($logContent -match "was not detected on this system") {
              Write-Host "Installer correctly and gracefully detected that Office is not installed on this CI runner (expected — GitHub-hosted Windows runners don't have Office). This is the CORRECT behavior, not a crash, so this is NOT treated as a test failure. Full end-to-end verification (tab appears in a real Excel) remains a required human step per spec Section 12."
              exit 0
            }
            Write-Host "Silent install FAILED for an UNEXPECTED reason (exit $($p.ExitCode))"
            exit 1
          }
          $addinDll = "$env:LOCALAPPDATA\Programs\OMNIX\OMNIX.Excel.dll"
          if (-not (Test-Path $addinDll)) {
            Write-Host "Install reported success but $addinDll is missing — treating as failure."
            exit 1
          }
          Write-Host "Silent install verified OK — OMNIX.Excel.dll present at $addinDll"

      - name: "TEMP diagnostic (this round only): post VSTO Runtime status lines to an Issue regardless of pass/fail, so this can be inspected without another human download-and-test round"
        if: always()
        shell: pwsh
        run: |
          $full = ""
          $ourLog = "$env:LOCALAPPDATA\OMNIX\logs\install-debug.log"
          if (Test-Path $ourLog) { $full = Get-Content $ourLog -Raw }
          if (-not $full) { $full = "(file empty or missing)" }
          $body = @{
            title = "TEMP VSTO diagnostic — run $env:GITHUB_RUN_ID"
            body  = "``````text`n$full`n``````"
          } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = "application/vnd.github+json" }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues" -Method Post -Headers $headers -Body $body -ContentType "application/json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post build output to a GitHub Issue if the silent-install test failed (diagnostic)
        if: failure()
        shell: pwsh
        run: |
          $full = ""
          if (Test-Path install_test.log) { $full += (Get-Content install_test.log -Raw) }
          if (Test-Path "$env:LOCALAPPDATA\OMNIX\logs\install-debug.log") {
            $full += "`n--- install-debug.log ---`n" + (Get-Content "$env:LOCALAPPDATA\OMNIX\logs\install-debug.log" -Raw)
          }
          if (-not $full) { $full = "(no install_test.log or install-debug.log produced)" }
          if ($full.Length -gt 55000) { $full = $full.Substring($full.Length - 55000) }
          $body = @{
            title = "CI SILENT-INSTALL failure — run $env:GITHUB_RUN_ID"
            body  = "``````text`n$full`n``````"
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues" -Method Post -Headers $headers -Body $body -ContentType "application/json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove the temporary Defender build exclusion before the honest scan (spec 2.9 must run with full real-time protection, no exclusions)
        shell: pwsh
        run: |
          try {
            Remove-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Write-Host "Defender exclusion removed — real-time protection is fully back on for the honest check."
          } catch {
            Write-Host "Could not remove Defender exclusion (non-fatal, may not have been set): $_"
          }

      - name: Windows Defender check with real-time protection ON (spec 2.9 — honest)
        shell: pwsh
        run: |
          $out = "build_output_defender.txt"
          try {
            & ./build/defender-check.ps1 *>&1 | Tee-Object -FilePath $out
            $code = $LASTEXITCODE
          } catch {
            $msg = "EXCEPTION while invoking build/defender-check.ps1: $($_.Exception.GetType().FullName): $($_.Exception.Message)`n$($_.ScriptStackTrace)"
            $msg | Tee-Object -FilePath $out
            $code = 1
          }
          if (-not (Test-Path $out) -or (Get-Item $out).Length -eq 0) {
            "defender-check.ps1 produced no output at all (script may have failed to parse/load) and threw no catchable exception either." | Out-File $out
            $code = 1
          }
          exit $code

      - name: Post build output to a GitHub Issue if the Defender check step failed (diagnostic — network to blob storage is restricted for the human/AI reviewing this)
        if: failure()
        shell: pwsh
        run: |
          $full = (Get-ChildItem build_output_*.txt -ErrorAction SilentlyContinue | Sort-Object Name | Get-Content -Raw) -join "`n--- next file ---`n"
          if (-not $full) { $full = "(no build_output_*.txt files were produced)" }
          if ($full.Length -gt 55000) { $full = $full.Substring($full.Length - 55000) }
          $body = @{
            title = "CI build failure — run $env:GITHUB_RUN_ID"
            body  = "``````text`n$full`n``````"
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues" -Method Post -Headers $headers -Body $body -ContentType "application/json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (installer + reports + logs)
        uses: actions/upload-artifact@v4
        with:
          name: omnix-build
          path: |
            installer/Output/*.exe
            build/defender-report.txt
            build/logs/build.binlog
          if-no-files-found: error

      - name: Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/OMNIX-Setup-*.exe
          body: |
            OMNIX ${{ github.ref_name }} — single-exe installer.

            **Install:** download the ONE .exe below and run it (no zip, no helper files).
            Excel/Word/PowerPoint are detected automatically; only the hosts that exist
            on your system are registered. The only step that may ask for Administrator
            permission is the Microsoft VSTO Runtime bootstrap (transparent UAC, only
            when it is actually missing).

            **Honest notes:**
            - The installer is signed with a temporary self-signed certificate.
              Until a real Authenticode certificate is used (spec 10.2), SmartScreen
              may show "Windows protected your PC" — choose "More info → Run anyway".
            - A Windows Defender scan with real-time protection ON ran in CI; the
              result is in the build artifacts (defender-report.txt).
          draft: false
          prerelease: false
