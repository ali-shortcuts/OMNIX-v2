# ============================================================================
# OMNIX CI — build the full solution on Windows, package the single-exe
# installer, run the honest Defender check, and (on version tags) publish a
# GitHub Release with the ONE .exe file (spec Phase 2.7, 2.8, Section 12).
# ============================================================================
name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  SOLUTION: OMNIX.sln
  CONFIGURATION: Release

jobs:
  build:
    name: Build + package (windows-latest)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exclude workspace from Windows Defender real-time scanning during build (mitigates a transient file-lock race where the FindRibbons VSTO task reflects-loads a just-written host DLL a fraction of a second after CoreCompile writes it — the 2nd/3rd project in a multi-project VSTO solution build is the one usually hit, matching the observed OMNIX.Word/OMNIX.PowerPoint failures while OMNIX.Excel, built first, succeeded)
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Write-Host "Defender exclusion added for $env:GITHUB_WORKSPACE"
          } catch {
            Write-Host "Could not add Defender exclusion (non-fatal): $_"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-prerelease: false

      - name: Ensure VSTO SDK is present (installs Office dev tools if missing)
        shell: pwsh
        run: ./build/ensure-vsto-sdk.ps1

      - name: Create temporary self-signed code-signing certificate
        id: cert
        shell: pwsh
        run: |
          ./build/create-signing-cert.ps1
          $thumb = (Get-Content build/cert/thumbprint.txt).Trim()
          "thumbprint=$thumb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Thumbprint: $thumb"

      - name: NuGet restore
        shell: pwsh
        run: |
          if (-not (Test-Path build/nuget.exe)) {
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile build/nuget.exe
          }
          ./build/nuget.exe restore $env:SOLUTION

      - name: Build solution (3 independent fallback strategies — see build/build-with-fallbacks.ps1)
        shell: pwsh
        run: ./build/build-with-fallbacks.ps1 ${{ steps.cert.outputs.thumbprint }}

      - name: Post build output to a GitHub Issue if the build failed (diagnostic — network to blob storage is restricted for the human/AI reviewing this)
        if: failure()
        shell: pwsh
        run: |
          $full = (Get-ChildItem build_output_*.txt -ErrorAction SilentlyContinue | Sort-Object Name | Get-Content -Raw) -join "`n--- next file ---`n"
          if (-not $full) { $full = "(no build_output_*.txt files were produced by any strategy)" }
          if ($full.Length -gt 55000) { $full = $full.Substring($full.Length - 55000) }
          $body = @{
            title = "CI build failure — run $env:GITHUB_RUN_ID"
            body  = "``````text`n$full`n``````"
          } | ConvertTo-Json
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues" -Method Post -Headers $headers -Body $body -ContentType "application/json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage installer payload
        shell: pwsh
        run: ./build/package.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile single-exe installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer/installer.iss"
          Get-ChildItem installer/Output

      - name: Remove the temporary Defender build exclusion before the honest scan (spec 2.9 must run with full real-time protection, no exclusions)
        shell: pwsh
        run: |
          try {
            Remove-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Write-Host "Defender exclusion removed — real-time protection is fully back on for the honest check."
          } catch {
            Write-Host "Could not remove Defender exclusion (non-fatal, may not have been set): $_"
          }

      - name: Windows Defender check with real-time protection ON (spec 2.9 — honest)
        shell: pwsh
        run: ./build/defender-check.ps1

      - name: Upload build artifacts (installer + reports + logs)
        uses: actions/upload-artifact@v4
        with:
          name: omnix-build
          path: |
            installer/Output/*.exe
            build/defender-report.txt
            build/logs/build.binlog
          if-no-files-found: error

      - name: Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/OMNIX-Setup-*.exe
          body: |
            OMNIX ${{ github.ref_name }} — single-exe installer.

            **Install:** download the ONE .exe below and run it (no zip, no helper files).
            Excel/Word/PowerPoint are detected automatically; only the hosts that exist
            on your system are registered. The only step that may ask for Administrator
            permission is the Microsoft VSTO Runtime bootstrap (transparent UAC, only
            when it is actually missing).

            **Honest notes:**
            - The installer is signed with a temporary self-signed certificate.
              Until a real Authenticode certificate is used (spec 10.2), SmartScreen
              may show "Windows protected your PC" — choose "More info → Run anyway".
            - A Windows Defender scan with real-time protection ON ran in CI; the
              result is in the build artifacts (defender-report.txt).
          draft: false
          prerelease: false
