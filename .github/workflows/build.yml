# OMNIX v3 CI
#
# This workflow builds and packages a DEVELOPMENT installer. It intentionally does NOT publish
# GitHub Releases. A public release requires real Office/UI/provider evidence plus a trusted
# production Authenticode signature; GitHub-hosted runners cannot prove those conditions.
name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION: OMNIX.sln
  CONFIGURATION: Release

jobs:
  build:
    name: Build + package (windows-2022)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Temporarily exclude workspace from Defender during VSTO compilation
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Write-Host "Temporary build exclusion added. It will be removed before the release-artifact scan."
          } catch {
            Write-Host "Could not add temporary Defender exclusion (non-fatal): $_"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-prerelease: false

      - name: Ensure VSTO SDK is present
        shell: pwsh
        run: ./build/ensure-vsto-sdk.ps1

      - name: Create non-exportable DEVELOPMENT manifest-signing certificate
        id: cert
        shell: pwsh
        run: |
          ./build/create-signing-cert.ps1
          if (Test-Path build/cert/OMNIX.pfx) {
            throw "Private signing key file must never exist in CI/release payload."
          }
          $thumb = (Get-Content build/cert/thumbprint.txt -Raw).Trim()
          if (-not $thumb) { throw "Development certificate thumbprint is empty." }
          "thumbprint=$thumb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Development manifest signer ready. Private key remains in CurrentUser certificate store."

      - name: NuGet restore
        shell: pwsh
        run: |
          if (-not (Test-Path build/nuget.exe)) {
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile build/nuget.exe
          }
          ./build/nuget.exe restore $env:SOLUTION

      - name: Build solution with signed VSTO manifests
        shell: pwsh
        run: ./build/build-with-fallbacks.ps1 ${{ steps.cert.outputs.thumbprint }}

      - name: Stage installer payload and reject private-key leakage
        shell: pwsh
        run: ./build/package.ps1

      - name: Bundle official Microsoft VSTO Runtime redistributable
        shell: pwsh
        run: |
          $dest = "installer\payload\vstor_redist.exe"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest `
            -Uri "https://download.microsoft.com/download/C/0/0/C001737F-822B-48C2-8F6A-CDE13B4B9E9C/vstor_redist.exe" `
            -OutFile $dest `
            -UseBasicParsing `
            -TimeoutSec 180
          $size = (Get-Item $dest).Length
          if ($size -lt 10000000) { throw "vstor_redist.exe is unexpectedly small ($size bytes)." }
          Write-Host "Bundled Microsoft VSTO Runtime: $size bytes"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile development single-exe installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }
          $ver = "0.0.0-dev"
          & $iscc "/DMyAppVersion=$ver" "installer/installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem installer\Output\OMNIX-Setup-*.exe | Select-Object -First 1
          if (-not $exe -or $exe.Length -lt 1MB) { throw "Installer output missing or unexpectedly small." }
          Write-Host "Development installer compiled: $($exe.Name) ($($exe.Length) bytes)"

      - name: Verify installer handles Office-less CI machine gracefully
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\Output\OMNIX-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer exe found." }

          $log = Join-Path $PWD "install_test.log"
          $p = Start-Process -FilePath $exe.FullName `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/LOG=$log","/NORESTART" `
            -Wait -PassThru

          if ($p.ExitCode -eq 0) {
            # Some runner images may happen to expose Office-compatible registration. If setup says
            # success, require that it actually copied the payload.
            $addinDll = "$env:LOCALAPPDATA\Programs\OMNIX\OMNIX.Excel.dll"
            if (-not (Test-Path $addinDll)) {
              throw "Installer returned success but OMNIX payload was not installed."
            }
            Write-Host "Installer completed successfully on this runner."
            exit 0
          }

          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          if ($text -match 'Microsoft Office .* was not detected' -or
              $text -match 'No supported Excel, Word or PowerPoint installation was found') {
            Write-Host "Expected: GitHub-hosted runner has no supported Office host. Installer refused cleanly instead of crashing."
            exit 0
          }

          Write-Host $text
          throw "Installer failed for an unexpected reason (exit $($p.ExitCode))."

      - name: Remove temporary Defender exclusion
        if: always()
        shell: pwsh
        run: |
          try {
            Remove-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Write-Host "Temporary Defender build exclusion removed."
          } catch {
            Write-Host "Could not remove exclusion (it may never have been added): $_"
          }

      - name: Windows Defender scan with real-time protection restored
        shell: pwsh
        run: ./build/defender-check.ps1

      - name: Generate development artifact manifest
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\Output\OMNIX-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "Installer missing before artifact manifest generation." }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $sig = Get-AuthenticodeSignature $exe.FullName
          $manifest = [ordered]@{
            ArtifactType = 'DEVELOPMENT_ONLY'
            SourceCommit = $env:GITHUB_SHA
            FileName = $exe.Name
            SizeBytes = [int64]$exe.Length
            Sha256 = $hash
            AuthenticodeStatus = [string]$sig.Status
            RealOfficeRuntimeTested = $false
            ProductionReleaseApproved = $false
            Note = 'CI build artifact only. Real Office/UI/provider acceptance and trusted production signing are mandatory before release.'
          }
          New-Item -ItemType Directory -Force build\artifact | Out-Null
          $manifest | ConvertTo-Json -Depth 6 | Set-Content build\artifact\manifest.json -Encoding UTF8
          $hash | Set-Content build\artifact\installer.sha256 -Encoding ASCII
          $manifest | ConvertTo-Json -Depth 6

      - name: Upload development build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnix-development-build
          path: |
            installer/Output/*.exe
            build/artifact/manifest.json
            build/artifact/installer.sha256
            build/defender-report.txt
            build/logs/*.binlog
          if-no-files-found: error

# No automatic GitHub Release step belongs in this workflow.
# Release only after tools/release-readiness.ps1 returns OverallPass=true for the exact installer
# and a trusted production Authenticode signing path is in place.
