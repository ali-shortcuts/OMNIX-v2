name: cleanroom-build

on:
  push:
    branches:
      - rebuild/omnix-v4-cleanroom
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile and test cleanroom source
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\OMNIX.sln

      - name: Build Release
        shell: pwsh
        run: dotnet build .\OMNIX.sln -c Release --no-restore -warnaserror

      - name: Verify expected assemblies
        shell: pwsh
        run: |
          $required = @(
            'src/OMNIX.Core/bin/Release/net48/OMNIX.Core.dll',
            'src/OMNIX.Excel/bin/Release/net48/OMNIX.Excel.dll',
            'src/OMNIX.Word/bin/Release/net48/OMNIX.Word.dll',
            'src/OMNIX.PowerPoint/bin/Release/net48/OMNIX.PowerPoint.dll'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error ('Missing cleanroom build outputs: ' + ($missing -join ', '))
            exit 1
          }
          Write-Host 'CLEANROOM-COMPILE-001 PASS'

      - name: Run core runtime acceptance
        shell: pwsh
        run: dotnet run --project .\tests\OMNIX.Core.Tests\OMNIX.Core.Tests.csproj -c Release

      - name: Build Excel VSTO bootstrap
        shell: pwsh
        run: |
          msbuild .\vsto\OMNIX.Excel.AddIn\OMNIX.Excel.AddIn.csproj /t:Build /p:Configuration=Release /p:Platform=AnyCPU /m /v:minimal

      - name: Verify Excel VSTO payload
        shell: pwsh
        run: |
          $base = 'vsto/OMNIX.Excel.AddIn/bin/Release'
          $dll = Join-Path $base 'OMNIX.Excel.AddIn.dll'
          if (-not (Test-Path $dll)) {
            Write-Error "Missing Excel VSTO assembly: $dll"
            exit 1
          }
          $vsto = Get-ChildItem -Path $base -Filter '*.vsto' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $manifest = Get-ChildItem -Path $base -Filter '*.dll.manifest' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $vsto -or -not $manifest) {
            Write-Error 'Excel VSTO build did not produce both .vsto and .dll.manifest deployment files.'
            exit 1
          }
          Write-Host ('CLEANROOM-EXCEL-VSTO-001 PASS dll=' + $dll + ' vsto=' + $vsto.Name + ' manifest=' + $manifest.Name)
