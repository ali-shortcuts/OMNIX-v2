name: cleanroom-build

on:
  push:
    branches:
      - rebuild/omnix-v4-cleanroom
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile and test cleanroom source
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\OMNIX.sln

      - name: Build Release
        shell: pwsh
        run: dotnet build .\OMNIX.sln -c Release --no-restore -warnaserror

      - name: Verify expected assemblies
        shell: pwsh
        run: |
          $required = @(
            'src/OMNIX.Core/bin/Release/net48/OMNIX.Core.dll',
            'src/OMNIX.Excel/bin/Release/net48/OMNIX.Excel.dll',
            'src/OMNIX.Word/bin/Release/net48/OMNIX.Word.dll',
            'src/OMNIX.PowerPoint/bin/Release/net48/OMNIX.PowerPoint.dll'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Error ('Missing cleanroom build outputs: ' + ($missing -join ', '))
            exit 1
          }
          Write-Host 'CLEANROOM-COMPILE-001 PASS'

      - name: Run core runtime acceptance
        shell: pwsh
        run: dotnet run --project .\tests\OMNIX.Core.Tests\OMNIX.Core.Tests.csproj -c Release
