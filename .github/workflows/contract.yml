name: architecture-contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: OMNIX anti-drift contract
    runs-on: windows-2022
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          # github.sha is a synthetic merge commit for pull_request events. The release gate
          # requires evidence for the actual OMNIX branch head, so test that exact head here.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Report tested source commit
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($source -notmatch '^[0-9a-fA-F]{40}$') { throw "Could not resolve exact tested source commit." }
          Write-Host "OMNIX contract source commit: $source"

      - name: Enforce OMNIX architecture and safety contract
        shell: pwsh
        run: ./build/contract-gates.ps1

      - name: Enforce real-evidence release contract
        shell: pwsh
        run: ./build/real-evidence-contract-gates.ps1

      - name: Enforce final Office AI and lifecycle evidence contract
        shell: pwsh
        run: ./build/final-evidence-contract-gates.ps1
